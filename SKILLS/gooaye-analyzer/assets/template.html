<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股癌 EP{{EP_NUMBER}} 投資全紀錄 | 內容摘要 + AI 深度分析</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #0f172a;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --positive: #f43f5e;
            --highlight: #fbbf24;
            --sidebar-width: 280px;
            --ai-accent: #8b5cf6;
            --section-bg: rgba(30, 41, 59, 0.5);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        aside {
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid #1e293b;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            display: none;
            z-index: 100;
        }

        @media (min-width: 1024px) {
            aside { display: block; }
            main { margin-left: var(--sidebar-width); }
        }

        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 60px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 20px;
        }

        .ep-tag {
            background: var(--accent-color);
            color: #000;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 { font-size: 2.8rem; margin: 0; letter-spacing: -1px; }
        .subtitle { color: var(--text-secondary); font-size: 1.2rem; margin-top: 10px; }

        section { 
            margin-bottom: 100px; 
            padding: 40px;
            border-radius: 24px;
            background: var(--section-bg);
            border: 1px solid #1e293b;
        }
        
        h2 { 
            font-size: 2rem; 
            color: var(--accent-color); 
            display: flex; 
            align-items: center; 
            gap: 15px;
            margin-bottom: 40px;
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: #1e293b80;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-color);
            background: #1e293b;
            transform: translateY(-5px);
        }

        .card h3 { margin-top: 0; color: var(--highlight); font-size: 1.3rem; }
        .card p { line-height: 1.7; color: var(--text-secondary); margin-bottom: 0; }

        .important-box {
            background: rgba(244, 63, 94, 0.1);
            border-left: 4px solid var(--positive);
            padding: 25px;
            border-radius: 8px;
            margin: 25px 0;
        }

        .kw {
            background: #334155;
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .ai-section {
            background: rgba(139, 92, 246, 0.1) !important;
            border: 1px solid var(--ai-accent) !important;
        }
        .ai-title { color: var(--ai-accent) !important; }

        .stock-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        .stock-table th, .stock-table td {
            text-align: left;
            padding: 20px;
            border-bottom: 1px solid #1e293b;
        }
        .stock-table th { color: var(--text-secondary); background: rgba(0,0,0,0.3); }
        .stock-code { color: var(--ai-accent); font-weight: bold; font-family: monospace; font-size: 1.2rem; }

        .logic-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
            display: inline-block;
            margin-top: 5px;
        }

        .top-btn {
            position: fixed; bottom: 30px; right: 30px; background: var(--accent-color);
            color: #000; width: 50px; height: 50px; border-radius: 25px;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-weight: bold; z-index: 1000;
        }

        .nav-item { list-style: none; margin-bottom: 20px; }
        .nav-link { color: var(--text-secondary); text-decoration: none; transition: 0.2s; font-size: 1.1rem; }
        .nav-link:hover { color: var(--accent-color); padding-left: 10px; }

    </style>
</head>
<body>

    <aside>
        <div style="font-size: 1.5rem; font-weight: bold; margin-bottom: 40px; color: var(--accent-color);">EP{{EP_NUMBER}} 筆記選單</div>
        <nav id="nav-list">
            <!-- 動態生成導航 -->
        </nav>
    </aside>

    <main>
        <header>
            <div class="ep-tag">EP{{EP_NUMBER}}</div>
            <h1>{{EP_TITLE}} 🍐</h1>
            <p class="subtitle">{{DATE}} 投資全紀錄：Podcast 內容摘要 + AI 專屬分析</p>
        </header>

        <div id="content-sections">
            <!-- 內容區塊 -->
        </div>

        <footer>
            <p style="text-align: center; color: var(--text-secondary); margin-top: 100px;">
                &copy; {{YEAR}} Gooaye Summary & AI Analysis | 內容僅供參考，投資請審慎評估
            </p>
        </footer>
    </main>

    <a href="#" class="top-btn">TOP</a>

</body>
</html>
